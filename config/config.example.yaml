# =============================================================================
# goldbot configuration — EXAMPLE
#
# Copy this file to config/config.yaml and fill in your details:
#     copy config\config.example.yaml config\config.yaml     (Windows)
#     cp   config/config.example.yaml config/config.yaml     (Linux/macOS)
#
# config/config.yaml is gitignored — your credentials never reach the repo.
#
# Any value may be written as ${ENV_VAR} to pull it from an environment
# variable instead of storing it in this file. Recommended for passwords.
# =============================================================================

# -----------------------------------------------------------------------------
# SAFETY — read this section before anything else
# -----------------------------------------------------------------------------
# dry_run: true  → the full pipeline runs, every decision is journalled, and NO
#                  orders are ever sent. Start here. Stay here for days.
#
# Sending real orders needs BOTH of the following, deliberately separate so that
# one typo cannot arm real money:
#     dry_run: false
#     live_confirm: "I_UNDERSTAND_THIS_TRADES_REAL_MONEY"
dry_run: true
live_confirm: null

# -----------------------------------------------------------------------------
# MetaTrader 5 connection
# -----------------------------------------------------------------------------
mt5:
  # Leave login/password/server as null to use whatever account the MT5 terminal
  # is already logged into. Filling them in makes the bot log in explicitly,
  # which is safer: it can never attach to the wrong account by accident.
  login: null                     # e.g. 51234567
  # null = use whatever account the terminal is already logged into.
  # scripts/setup_config.py sets this to ${MT5_PASSWORD} for you and stores the
  # password in that environment variable. To do it by hand:
  #     setx MT5_PASSWORD "your-password"
  # and then change the line below to:  password: ${MT5_PASSWORD}
  password: null
  server: null                    # e.g. "ICMarketsSC-Demo"
  terminal_path: null             # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"

  # Gold is named differently at every broker. Leave `symbol` null and the bot
  # probes the candidates below, picking the first one that is actually tradable.
  # scripts/check_connection.py prints which one it found.
  symbol: null
  symbol_candidates:
    - XAUUSD
    - XAUUSD.m
    - XAUUSDm
    - XAUUSD.raw
    - XAUUSD_o
    - XAUUSD.a
    - XAUUSDc
    - GOLD
    - GOLD.m
    - Gold

  # Tags our orders. The bot only ever reads, modifies or closes positions
  # carrying this number — trades you place by hand are invisible to it.
  magic: 20260907
  deviation_points: 20

  # Account-currency value of a 1-point move on 1.00 lot.
  #
  # LEAVE THIS NULL. The bot asks the broker's own order_calc_profit(), which is
  # the number the broker will actually settle against. Set it only if
  # check_connection.py reports that the broker's contract specification
  # contradicts itself — some demo servers quote a tick_value that is wrong by a
  # large factor, and because lots = risk / (stop x this value), an understated
  # value oversizes every single position by that same factor.
  #
  # For standard 100oz XAUUSD on a USD account the correct value is 1.00.
  value_per_point_override: null
  connect_timeout_s: 30.0

# -----------------------------------------------------------------------------
# RISK — the Risk Warden enforces every value here. No AI agent can override it.
# -----------------------------------------------------------------------------
risk:
  # Percent of equity risked per trade, measured to the stop loss.
  # On a $5,000 account, 1.0 = $50 risked per trade.
  risk_per_trade_pct: 1.0

  # Realised loss vs start-of-day equity that closes everything and halts
  # trading until the next day.
  daily_loss_limit_pct: 4.0

  # Percent of starting balance below which the bot halts permanently until you
  # clear it by hand. 80.0 = stop after a 20% total drawdown.
  equity_floor_pct: 80.0

  # Halt and alert after this many losing trades in a row. Requires /resume.
  max_consecutive_losses: 5

  max_open_positions: 2
  max_lot: 1.0

  # THE most important scalping filter. Gold's spread widens hard around news
  # and in the Asian session; entering then is how scalping accounts bleed out.
  # Run scripts/check_connection.py during your session to see typical values.
  max_spread_points: 30

  max_daily_trades: 10

  # Reject setups whose stop is tighter than this — spread noise alone would
  # stop them out regardless of which way price goes.
  min_stop_points: 100

# -----------------------------------------------------------------------------
# STRATEGY — the deterministic signal generator (agents cannot change these)
# -----------------------------------------------------------------------------
strategy:
  # M5 and M15 are the two supported scalping timeframes and both are tested.
  # Which one to run is a question for the backtest, not for taste — run
  # scripts/compare_timeframes.py on your own exported history and pick from
  # the numbers.
  #
  # The tradeoff: M5 gives roughly 3x the signals, but its ATR is smaller, so
  # stops are tighter and the SAME spread eats a much larger share of each
  # trade's risk. A 25-point spread against a 400-point M15 stop is 6% of risk;
  # against a 150-point M5 stop it is 17%. M5 needs a tight-spread broker to be
  # viable at all. Check max_spread_points and min_stop_points below if you
  # switch — M5 setups are the ones min_stop_points will start rejecting.
  timeframe: M15          # M5 | M15 | M30 | H1
  fast_ema: 20
  trend_ema: 50
  slow_ema: 200
  atr_period: 14
  adx_period: 14
  rsi_period: 14
  min_adx: 20.0           # below this the market is treated as rangebound

  # Bars back in which price must have touched the fast EMA. Without this the
  # rule would buy any strong bar in an uptrend — chasing, which puts the stop
  # far away and ruins the reward-to-risk.
  pullback_lookback: 3

  # Momentum window. Longs need RSI between these; shorts use the mirror
  # (100 - rsi_extreme, 100 - rsi_midline). The ceiling keeps the bot out of
  # blow-off moves, where the structural stop is furthest from entry.
  rsi_midline: 50.0
  rsi_extreme: 70.0

  atr_stop_multiple: 1.5  # stop distance = 1.5 x ATR

  # Place the stop beyond the pullback swing when that is further than the ATR
  # stop. A stop inside the structure gets hit by the same noise that built it.
  use_structural_stop: true
  tp_r_multiple: 2.0      # take profit at 2x the risked distance
  breakeven_at_r: 1.0     # move stop to entry at +1R (null to disable)
  trail_after_r: 1.5      # start ATR trailing at +1.5R (null to disable)
  trail_atr_multiple: 2.0
  one_entry_per_bar: true

# -----------------------------------------------------------------------------
# SESSIONS — when new entries are permitted (times in the timezone below)
# -----------------------------------------------------------------------------
sessions:
  timezone: Europe/London
  windows:
    - name: london
      start: "08:00"
      end: "12:00"
    - name: ny_overlap
      start: "13:30"
      end: "17:00"
  trade_days: [0, 1, 2, 3, 4]     # Mon=0 … Sun=6

  # Every day ends flat. Nothing is held through the Asian session (widest
  # spread, nobody watching) and each day's result stands on its own, which is
  # what lets the Day Auditor say something precise about it.
  flatten_daily: true
  daily_close: "19:30"            # must be after the last window ends

  # Only matters if flatten_daily is off — otherwise Friday closes at daily_close.
  flatten_before_weekend: true
  friday_close: "20:00"

# -----------------------------------------------------------------------------
# DAILY ROUTINE — the phases the agents run to (docs/AGENTS.md)
#
#   07:30  PRE-FLIGHT  Session Supervisor + News Scout + Regime Analyst → day plan
#   08:00  HUNT        London window: entries permitted
#   12:00  HOLD        between windows: manage only
#   13:30  HUNT        NY overlap: entries permitted
#   17:00  WIND-DOWN   tighten and exit only
#   19:30  FLATTEN     close everything, confirm flat (code, not an agent)
#   19:45  DEBRIEF     Day Auditor reconciles and reports
#
# Phases decide what is PERMITTED; inside a phase the engine is event-driven.
# A fixed routine makes the number of agent calls per day predictable, and
# gives one unambiguous answer to "what may the bot do right now".
# -----------------------------------------------------------------------------
routine:
  enabled: true
  preflight: "07:30"              # in sessions.timezone; ≥ 15 min before the first window
  preflight_min_lead_min: 15
  debrief_after_min: 15           # Day Auditor runs this long after daily_close

# -----------------------------------------------------------------------------
# ECONOMIC CALENDAR — deterministic blackouts, no AI involved
# -----------------------------------------------------------------------------
calendar:
  enabled: true
  feed_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  refresh_hours: 24               # the feed rate-limits frequent downloads
  impacts: [High]
  currencies: [USD]
  blackout_before_min: 15
  blackout_after_min: 15
  # true = also close open positions ahead of a high-impact event.
  # false = only block new entries (existing trades keep their stops).
  close_positions_before_event: false

# -----------------------------------------------------------------------------
# AI AGENTS
#
# All are disabled by default so the deterministic core can be proven first.
# Enable them in the staged order described in docs/AGENTS.md.
#
# Every agent runs on Opus 5. Each one either reads ambiguous information or
# touches a money decision, and both are what the cheaper tiers are worse at —
# a news brief that misreads a Fed statement costs far more than the tokens it
# saved. Effort is xhigh on the four whose output is hardest to check after
# the fact (the day plan, the two deciding whether a trade happens, and the
# weekly review that proposes parameter changes); high on the rest.
#
# Two agents bracket the day. The Session Supervisor runs once at pre-flight and
# sets the plan; the Day Auditor runs once after the flatten and reconciles it.
# Neither can raise risk. Neither can be talked into it.
#
# Cost is controlled by CADENCE, not by model choice. Agents are event-driven,
# and daily_cost_limit_usd is the hard backstop. Read the note on it.
#
# The API key is read from the environment, never stored here.
# -----------------------------------------------------------------------------
agents:
  api_key_env: ANTHROPIC_API_KEY

  # 1. Runs once at pre-flight. Reads the news brief, the regime view, the
  #    account and yesterday's audit → ONE plan for the day: normal, reduced
  #    size (a multiplier ≤ 1.0), or stand aside. Asks "should we trade today
  #    at all?" deliberately, before the first signal, rather than implicitly.
  #    Authority: reduce or stand down. Nothing else.
  session_supervisor:
    enabled: false
    model: claude-opus-5
    effort: xhigh
    timeout_s: 90.0
    cache_ttl_s: 86400      # the plan lasts the day

  # 2. Reads live gold/USD/rates coverage → structured news brief. Advisory only.
  #    The highest-volume agent — cache_ttl_s, not the model, is its cost lever.
  news_scout:
    enabled: false
    model: claude-opus-5
    effort: high
    timeout_s: 60.0
    max_tokens: 4000
    cache_ttl_s: 3600       # past this the brief is "no view", never stale-but-trusted

  # 3. Interprets H4/D1 structure and volatility → regime label. May only REDUCE risk.
  #    Runs a few times a day, so effort here is nearly free.
  regime_analyst:
    enabled: false
    model: claude-opus-5
    effort: high
    timeout_s: 45.0
    cache_ttl_s: 14400

  # 4. The main decision maker. May only APPROVE / VETO / REDUCE.
  #    xhigh: this is the call that puts money at risk, and a wrong approval is
  #    not something you can audit until the trade has already lost.
  decision:
    enabled: false
    model: claude-opus-5
    effort: xhigh
    timeout_s: 60.0

  # 5. Devil's advocate: argues the case against each proposed trade. It is
  #    explicitly allowed to report "no material objection" — a challenger forced
  #    to always disagree produces noise, not scrutiny. A material objection
  #    vetoes or shrinks the trade, so no third arbiter is needed.
  devils_advocate:
    enabled: false
    model: claude-opus-5
    effort: xhigh
    timeout_s: 60.0

  # 6. Manages open positions. May only reduce risk — never widens a stop or adds size.
  #    THE BIGGEST COST DRIVER: it runs repeatedly while a position is open.
  #    Raise min_interval_s before touching anything else if the bill is too high.
  trade_manager:
    enabled: false
    model: claude-opus-5
    effort: high
    timeout_s: 45.0
    min_interval_s: 300     # cost backstop; the agent is triggered by events, not this clock

  # 7. Runs once at debrief, after the flatten has settled. Confirms the bot is
  #    flat and its records match the broker's, then: did the plan survive
  #    contact? what did each veto cost or save? Writes the day record and a
  #    short Telegram summary. Zero authority.
  day_auditor:
    enabled: false
    model: claude-opus-5
    effort: high
    max_tokens: 8000
    timeout_s: 120.0

  # 8. Weekly journal review. Zero live authority — it writes you a report.
  #    Runs once a week, so xhigh costs pennies and its output shapes what you
  #    change next week.
  reviewer:
    enabled: false
    model: claude-opus-5
    effort: xhigh
    max_tokens: 16000
    timeout_s: 300.0

  # Stop calling agents once the day's estimated spend passes this.
  #
  # READ THIS. With all eight agents on Opus 5, realistic spend is $4-8/day —
  # the two new ones add two calls a day, which is nearly nothing. On a
  # $5,000 account that is 2.5-5% of equity PER MONTH in costs — more than most
  # strategies produce in edge. This is the single biggest structural problem
  # with running six Opus agents against a small account.
  #
  # The lever is cadence, not model choice: trade_manager.min_interval_s and
  # news_scout.cache_ttl_s dominate the bill. Doubling both roughly halves it.
  #
  # Interaction to be aware of: once this cap trips, fail_closed means no agent
  # answers and therefore NO new trade is approved for the rest of the day.
  # Trading stops. That is the safe failure, but it is still a stop.
  daily_cost_limit_usd: 8.0

  # API error, timeout, malformed output or a refusal ⇒ no trade.
  # Missing a trade is free; an unreviewed trade is not.
  fail_closed: true

# -----------------------------------------------------------------------------
# TELEGRAM — alerts and remote kill switch
#
# NEVER paste the bot token into this file or any other file in the repo. It is
# a password: anyone holding it can read every alert and send commands to your
# bot, including the kill switch. Set it as an environment variable and leave
# the ${...} reference below alone. If a token ever leaks, revoke it in
# @BotFather (/mybots → your bot → API Token → Revoke current token).
#
#   bot_token: from @BotFather, /newbot  → set env var TELEGRAM_BOT_TOKEN
#   chat_id:   a NUMBER, not a username. It identifies the chat the bot sends
#              to — your own account, not the bot. Message @userinfobot and it
#              replies with your numeric Id (e.g. 812345678). The bot's
#              @username is not a chat id and will not work.
#              → set env var TELEGRAM_CHAT_ID
# -----------------------------------------------------------------------------
telegram:
  enabled: false
  # Left null because `enabled: false` above. When you turn Telegram on, set the
  # two environment variables and change these to ${TELEGRAM_BOT_TOKEN} and
  # ${TELEGRAM_CHAT_ID}. A ${VAR} reference for a variable you have not set is a
  # hard error at startup — deliberately, so a silently empty credential can
  # never reach the broker — which is why these ship as null rather than as
  # references to variables a fresh install does not have.
  bot_token: null
  chat_id: null
  alert_on_trades: true
  alert_on_errors: true
  allow_commands: true      # /status /pause /resume /flat /pnl

# -----------------------------------------------------------------------------
# REPORTING
#
# weekly_target_pct_* is your stated goal. It is a REPORTING BENCHMARK ONLY —
# nothing in the trading path can read it, so a return target can never push the
# bot into over-trading to "catch up".
# -----------------------------------------------------------------------------
reporting:
  weekly_target_pct_min: 3.0
  weekly_target_pct_max: 5.0
  journal_db: data/journal.db
  reports_dir: reports
  log_dir: logs
  log_level: INFO
