name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      force_briefing:
        description: "Regenerate the AI briefing now"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Start from the last published data so market prices and the
      # briefing survive a failed fetch.
      - name: Download previous data
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data.json" -o site/data.json || echo "No previous data"

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: AI briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_BRIEFING: ${{ inputs.force_briefing && '1' || '0' }}
        run: python scripts/briefing.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
